<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f5f9ff"/>
<title>PSUT Nexus — Interactive Innovation Roadmap</title>
<style>
:root{color-scheme:light;--paper:#f5f9ff;--ink:#0c244c;--muted:#526781;--glass:#ffffffed;--line:#d9e8f6;--tile:#ffffff;--road:#2c7dd0;--road-hi:#56b2ff;--road-shade:#17467e;--subtle:#e9f2fa;--shadow:0 22px 60px rgba(21,62,108,.14);--topshadow:rgba(26,86,150,.12);}
html[data-theme="dark"]{color-scheme:dark;--paper:#071427;--ink:#eff8ff;--muted:#b6c8dd;--glass:#101f37f3;--line:#2e4d70;--tile:#162941;--road:#276bb4;--road-hi:#329bed;--road-shade:#0c294d;--subtle:#122740;--shadow:0 28px 72px rgba(0,0,0,.36);--topshadow:rgba(0,0,0,.35);}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;transition:background .35s,color .35s}
body{background:radial-gradient(ellipse at 79% 2%,#40bbee1c,transparent 36%),radial-gradient(ellipse at 1% 98%,#1669cf10,transparent 38%),var(--paper)}
.shell{width:min(1240px,100%);margin:0 auto;padding:24px 14px 26px}
.topbar{min-height:136px;position:relative;text-align:center;padding:12px 130px 8px}
.eyebrow{text-transform:uppercase;letter-spacing:.27em;color:#168ecb;font-weight:800;font-size:11px;margin-bottom:1px}
h1{font-size:clamp(40px,5.8vw,73px);letter-spacing:-.065em;line-height:1.03;margin:0;font-weight:900;color:var(--ink)}h1 span{background:linear-gradient(105deg,#16b5e6,#2486da);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.055em}
.tagline{font-weight:750;letter-spacing:.06em;font-size:clamp(13px,1.6vw,18px);margin:7px 0 3px}.subtitle{font-size:clamp(11px,1.2vw,14px);color:var(--muted);margin:0;line-height:1.5}
.theme{position:absolute;top:16px;right:4px;border:1px solid var(--line);color:var(--ink);background:var(--tile);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 4px 17px var(--topshadow);font-size:12px;font-weight:750;touch-action:manipulation}
.theme:focus-visible,.stage:focus-visible,.close:focus-visible{outline:3px solid #00a2d9;outline-offset:5px}
.theme svg{height:18px;width:18px}.theme .sun{display:none}html[data-theme=dark] .theme .sun{display:block}html[data-theme=dark] .theme .moon{display:none}
.roadmap{position:relative;height:1110px;max-width:1200px;margin:0 auto;border-radius:25px;isolation:isolate;overflow:visible;}
.roadmap:before{position:absolute;content:"";inset:-100px 0 0;z-index:-4;pointer-events:none;background:radial-gradient(ellipse at 52% 43%,#58a7ee13,transparent 53%)}
.route-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:-1}
.route-svg .road-shadow{stroke:#0a346c21;stroke-width:70;fill:none;filter:blur(13px)}
.route-svg .road-bottom{stroke:var(--road-shade);stroke-width:75;fill:none}
.route-svg .road-white{stroke:#e1f4ff;stroke-width:58;fill:none;opacity:.82}
.route-svg .road-surface{stroke:var(--road);stroke-width:54;fill:none}
.route-svg .road-sheen{stroke:var(--road-hi);stroke-width:5;fill:none;opacity:.7}
.route-svg .lane{stroke:#edf9ff;stroke-width:2.7;stroke-dasharray:9 15;stroke-linecap:round;fill:none;opacity:.83}
.route-svg.mobile{display:none}
.roadmap .corner-decor{position:absolute;border:2px solid #15a2df23;border-radius:50%;height:310px;width:310px;transform:rotate(-28deg);z-index:-2;pointer-events:none}
.roadmap .decor-one{left:-120px;bottom:-55px}.roadmap .decor-two{right:-150px;top:-140px;height:390px;width:390px}
.stage{--accent:#11afd6;--deep:#1483aa;position:absolute;width:237px;height:207px;padding:0;top:var(--y);left:var(--x);transform:translate(-50%,-50%);border:0;background:none;color:var(--ink);cursor:pointer;z-index:3;outline:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:center;}
.stage[data-id="1"]{--accent:#19afe7;--deep:#087aaa;--x:36%;--y:81%}
.stage[data-id="2"]{--accent:#f3af24;--deep:#d98c0e;--x:37%;--y:62%}
.stage[data-id="3"]{--accent:#fa6487;--deep:#cf315b;--x:64%;--y:52%}
.stage[data-id="4"]{--accent:#9865e9;--deep:#7133bb;--x:45%;--y:35%}
.stage[data-id="5"]{--accent:#31c68f;--deep:#13966a;--x:70%;--y:16%}
.stage .float{position:absolute;inset:0;display:block;transform:translateY(0) rotateX(0deg) scale(1);transform-origin:50% 76%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.15,.78,.22,1.24),filter .35s;filter:drop-shadow(0 13px 12px rgba(24,59,104,.17))}
.stage:hover .float{transform:translateY(-8px) rotateX(4deg) scale(1.025)}
.stage.is-active .float{transform:translateY(-13px) rotateX(-7deg) scale(1.05);filter:drop-shadow(0 24px 18px rgba(22,78,137,.28));}
.stage.pulse .float{animation:tap-lift .6s cubic-bezier(.24,.8,.26,1) 1}
@keyframes tap-lift{0%{transform:translateY(-2px) scale(1)}35%{transform:translateY(-24px) rotateX(-10deg) scale(1.055)}72%{transform:translateY(-11px) rotateX(3deg) scale(1.04)}100%{transform:translateY(-13px) rotateX(-7deg) scale(1.05)}}
.halo{position:absolute;left:17%;right:17%;bottom:10px;height:36px;border-radius:50%;background:var(--accent);opacity:.23;filter:blur(15px);transition:transform .4s,opacity .4s}
.stage.is-active .halo{transform:scale(1.24);opacity:.43}
.platform{position:absolute;bottom:19px;left:0;width:100%;height:90px;filter:drop-shadow(0 8px 4px #0e39602e)}
.platform .side{position:absolute;inset:10px 0 0;background:linear-gradient(150deg,var(--accent),var(--deep));clip-path:polygon(18% 2%,82% 2%,100% 27%,100% 70%,82% 98%,18% 98%,0 70%,0 27%)}
.platform .top{position:absolute;inset:0 0 25px;background:linear-gradient(145deg,#ffffff50 0%,#112e4b16 27%,#082b454a 100%),var(--accent);clip-path:polygon(19% 0,81% 0,100% 27%,100% 73%,81% 100%,19% 100%,0 73%,0 27%);box-shadow:inset 0 0 0 6px #fff9}
.platform .edge{position:absolute;inset:0 0 25px;border:2px solid #ffffffa3;clip-path:polygon(19% 0,81% 0,100% 27%,100% 73%,81% 100%,19% 100%,0 73%,0 27%);pointer-events:none}
.building-svg{position:absolute;width:183px;height:100px;left:50%;bottom:67px;transform:translateX(-50%);filter:drop-shadow(0 7px 4px #0e365630)}
.stage .logo-sign{position:absolute;z-index:2;left:50%;top:2px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;background:#fff;border:1.5px solid color-mix(in srgb,var(--accent) 65%,#fff);border-radius:13px;box-shadow:0 5px 14px #102d5438;width:151px;height:58px;padding:6px 8px;}
.logo-sign:after{content:"";position:absolute;background:#becad8;width:3px;height:17px;bottom:-17px;left:50%;z-index:-1}
.stage[data-id="4"] .logo-sign{width:187px;left:49%;top:0}
.stage[data-id="2"] .logo-sign{width:137px}
.stage[data-id="3"] .logo-sign{width:148px;height:68px;top:-7px}
.stage[data-id="5"] .logo-sign{width:152px;height:65px;top:-6px;flex-direction:row;gap:5px}
.stage .logo-sign img{height:100%;width:100%;object-fit:contain;display:block}
.stage[data-id="5"] .logo-sign img{height:48px;width:49px}.logo-word{color:#173452;font-size:22px;font-weight:900;letter-spacing:-.07em}
.stage[data-id="1"] .lightbulb{position:absolute;z-index:2;top:-9px;left:50%;transform:translateX(-50%);font-size:73px;line-height:1;filter:drop-shadow(0 5px 7px #f6ce5b80)}
.stage[data-id="1"] .building-svg{display:none}
.stage .stage-name{position:absolute;bottom:11px;left:0;right:0;z-index:2;color:#fff;font-size:14px;font-weight:900;text-shadow:0 1px 2px #18436e7a;letter-spacing:-.01em;white-space:nowrap}
.stage[data-id="4"] .stage-name{font-size:12px}
.stage .num{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:44px;height:44px;border:3px solid #fff;color:#fff;font-size:23px;font-weight:900;display:grid;place-items:center;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--deep));box-shadow:0 5px 14px #092b5740;z-index:4}
.stage .stage-name{bottom:50px;transform:translateY(9px)}
.stage[data-id="1"] .stage-name{bottom:77px;font-size:15px;color:#fff;text-shadow:0 1px 2px #115779}
.stage[data-id="1"] .num{bottom:6px}
.stage[data-id="1"] .platform{bottom:14px}
.stage.is-active{z-index:10}
.stage:focus-visible .platform .top{outline:5px solid #177cdd;outline-offset:5px}
.students{position:absolute;width:143px;height:165px;object-fit:contain;left:18%;top:72%;filter:drop-shadow(0 8px 9px #103f6b44);pointer-events:none;z-index:2}
.tap-hint{position:absolute;left:7%;bottom:22px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.01em;display:flex;gap:7px;align-items:center;z-index:1}
.tap-hint svg{width:20px;height:20px}
.panel{--accent:#20afe2;position:absolute;z-index:15;left:var(--px);top:var(--py);width:var(--pw);padding:18px 19px 19px;background:var(--glass);border:1.5px solid color-mix(in srgb,var(--accent) 65%,var(--line));border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(16px);transform:translateY(10px) scale(.97);transform-origin:top left;opacity:0;pointer-events:none;transition:transform .26s ease,opacity .26s ease;}
.panel.show{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
.panel[data-id="1"]{--accent:#19afe7;--px:61%;--py:72%;--pw:35%}
.panel[data-id="2"]{--accent:#f3af24;--px:1.5%;--py:59%;--pw:29%}
.panel[data-id="3"]{--accent:#fa6487;--px:75%;--py:48%;--pw:24%}
.panel[data-id="4"]{--accent:#9865e9;--px:1.5%;--py:30%;--pw:30%}
.panel[data-id="5"]{--accent:#31c68f;--px:77%;--py:10%;--pw:22%}
.panel .heading{display:flex;align-items:center;gap:9px;padding-right:22px;margin:0 0 9px}
.panel .pill{min-width:33px;height:33px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px;box-shadow:0 4px 12px #0a315334}
.panel h2{font-size:clamp(15px,1.6vw,19px);line-height:1.2;margin:0;font-weight:850;letter-spacing:-.03em}
.panel ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.panel li{position:relative;padding-left:19px;font-size:clamp(12px,1.14vw,14px);line-height:1.4;color:var(--ink)}
.panel li:before{content:"";position:absolute;left:1px;top:.56em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.close{position:absolute;right:11px;top:10px;border:0;color:var(--muted);background:none;font-size:24px;cursor:pointer;line-height:1;width:28px;height:28px;border-radius:50%}.close:hover{background:var(--subtle)}
.connector-svg{position:absolute;inset:0;pointer-events:none;z-index:12;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .28s}
.connector-svg.show{opacity:1}.connector-svg path{fill:none;stroke:var(--connector-color,#19afe7);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:800;stroke-dashoffset:800;filter:drop-shadow(0 1px 1px #0d3e7133)}.connector-svg.show path{animation:line-open .55s ease forwards}.connector-svg circle{fill:var(--connector-color,#19afe7);stroke:var(--paper);stroke-width:4}
@keyframes line-open{to{stroke-dashoffset:0}}
.mobile-connector{display:none}
/* Keep architecture in front of platform decking while retaining the bevel and shadows. */
.stage .platform{z-index:1}
.stage .building-svg{z-index:2}
.stage .logo-sign{z-index:5}
.stage[data-id="2"] .stage-name,.stage[data-id="3"] .stage-name,.stage[data-id="4"] .stage-name,.stage[data-id="5"] .stage-name{display:none}
@media (max-width:950px) and (min-width:681px){.roadmap{height:1000px}.stage{transform:translate(-50%,-50%) scale(.83)}.panel{padding:13px 14px}.panel[data-id="3"]{--px:75%;--pw:24%}.panel li{font-size:11.6px}.panel h2{font-size:15px}.students{width:110px;height:132px}}
@media(max-width:680px){
 .shell{padding:14px 5px 20px}.topbar{min-height:127px;padding:28px 8px 10px}.eyebrow{font-size:9px;letter-spacing:.2em}h1{font-size:clamp(36px,10vw,54px)}.tagline{font-size:14px;letter-spacing:0}.subtitle{font-size:11px;max-width:320px;margin:auto}.theme{top:0;right:8px;padding:6px 9px;font-size:11px}
 .roadmap{height:1000px;max-width:430px;border-radius:0;margin:auto;overflow:visible}
 .route-svg.desktop{display:none}.route-svg.mobile{display:block}
 .route-svg .road-shadow{stroke-width:58}.route-svg .road-bottom{stroke-width:57}.route-svg .road-white{stroke-width:45}.route-svg .road-surface{stroke-width:41}.route-svg .road-sheen{stroke-width:4}.route-svg .lane{stroke-width:2.2;stroke-dasharray:6 12}
 .stage{width:200px;height:180px;transform:translate(-50%,-50%) scale(.72);transform-origin:center center}
 .stage:hover .float{transform:translateY(0)}.stage.is-active .float{transform:translateY(-10px) rotateX(-6deg) scale(1.045)}
 .stage[data-id="1"]{--x:55%;--y:86%}.stage[data-id="2"]{--x:36%;--y:68%}.stage[data-id="3"]{--x:66%;--y:52%}.stage[data-id="4"]{--x:36%;--y:34%}.stage[data-id="5"]{--x:65%;--y:15%}
 .stage .platform{bottom:3px}.stage .building-svg{bottom:51px}.stage .stage-name{bottom:34px}.stage[data-id="1"] .stage-name{bottom:65px}.stage .num{bottom:-1px}.stage[data-id="1"] .num{bottom:-4px}
 .stage[data-id="4"] .logo-sign{top:-8px}.stage[data-id="5"] .logo-sign{top:-12px}
 .students{width:96px;height:125px;left:1%;top:79%}
 .panel{position:fixed!important;left:10px!important;right:10px!important;bottom:max(10px,env(safe-area-inset-bottom))!important;top:auto!important;width:auto!important;max-height:min(46vh,360px);overflow:auto;z-index:50;padding:17px 20px;transform:translateY(18px) scale(.98);transform-origin:bottom center}
 .panel h2{font-size:18px}.panel li{font-size:14px}.connector-svg{display:none}.mobile-connector{position:fixed;display:block;inset:0;width:100%;height:100%;z-index:45;pointer-events:none;opacity:0;transition:opacity .2s}.mobile-connector.show{opacity:1}.mobile-connector path{fill:none;stroke:var(--connector-color,#19afe7);stroke-width:3;stroke-dasharray:1600;stroke-dashoffset:1600}.mobile-connector.show path{animation:line-open .6s ease forwards}.mobile-connector circle{fill:var(--connector-color,#19afe7);stroke:var(--paper);stroke-width:3}
 .tap-hint{display:none}
 .roadmap .corner-decor{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="eyebrow">University-wide innovation ecosystem</div>
    <h1>PSUT <span>Nexus</span></h1>
    <p class="tagline">From Ideas to Impact</p>
    <p class="subtitle">Explore the stages by selecting any platform on the roadmap.</p>
    <button class="theme" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Toggle light / dark theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 14a8.5 8.5 0 0 1-10.5-10.5A9 9 0 1 0 20.5 14z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2m16 0h2M4.93 19.07l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Dark mode</span>
    </button>
  </header>

  <section class="roadmap" id="roadmap" aria-label="Interactive roadmap: idea, EIR, Venture Lab, QRCE, and iPARK">
    <div class="corner-decor decor-one"></div><div class="corner-decor decor-two"></div>
    <svg class="route-svg desktop" viewBox="0 0 1200 1110" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="roadSurface" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#62b8ff"/><stop offset="1" stop-color="#2267b1"/></linearGradient></defs>
      <path class="road-shadow" d="M172 1090 C210 1005 270 1003 427 1005 C565 1000 560 913 432 891 C306 870 314 783 434 767 C602 736 790 777 779 660 C778 589 643 572 515 558 C362 541 396 471 533 461 C713 426 809 423 839 335 C862 272 895 250 1053 203"/>
      <path class="road-bottom" d="M172 1090 C210 1005 270 1003 427 1005 C565 1000 560 913 432 891 C306 870 314 783 434 767 C602 736 790 777 779 660 C778 589 643 572 515 558 C362 541 396 471 533 461 C713 426 809 423 839 335 C862 272 895 250 1053 203"/>
      <path class="road-white" d="M172 1090 C210 1005 270 1003 427 1005 C565 1000 560 913 432 891 C306 870 314 783 434 767 C602 736 790 777 779 660 C778 589 643 572 515 558 C362 541 396 471 533 461 C713 426 809 423 839 335 C862 272 895 250 1053 203"/>
      <path class="road-surface" d="M172 1090 C210 1005 270 1003 427 1005 C565 1000 560 913 432 891 C306 870 314 783 434 767 C602 736 790 777 779 660 C778 589 643 572 515 558 C362 541 396 471 533 461 C713 426 809 423 839 335 C862 272 895 250 1053 203"/>
      <path class="lane" d="M172 1090 C210 1005 270 1003 427 1005 C565 1000 560 913 432 891 C306 870 314 783 434 767 C602 736 790 777 779 660 C778 589 643 572 515 558 C362 541 396 471 533 461 C713 426 809 423 839 335 C862 272 895 250 1053 203"/>
      <path d="M1044 204l-25 7 11-21z" fill="#2487d6"/>
    </svg>
    <svg class="route-svg mobile" viewBox="0 0 390 1000" preserveAspectRatio="none" aria-hidden="true">
      <path class="road-shadow" d="M80 985 C80 915 220 950 214 866 C210 786 98 792 132 709 C171 623 295 664 258 554 C223 473 75 482 145 371 C190 301 275 300 246 163 C239 95 299 70 312 21"/>
      <path class="road-bottom" d="M80 985 C80 915 220 950 214 866 C210 786 98 792 132 709 C171 623 295 664 258 554 C223 473 75 482 145 371 C190 301 275 300 246 163 C239 95 299 70 312 21"/>
      <path class="road-white" d="M80 985 C80 915 220 950 214 866 C210 786 98 792 132 709 C171 623 295 664 258 554 C223 473 75 482 145 371 C190 301 275 300 246 163 C239 95 299 70 312 21"/>
      <path class="road-surface" d="M80 985 C80 915 220 950 214 866 C210 786 98 792 132 709 C171 623 295 664 258 554 C223 473 75 482 145 371 C190 301 275 300 246 163 C239 95 299 70 312 21"/>

    <div class="tap-hint" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 21c-3 0-6-2.4-6-5.4 0-2.8 2-4.6 4-5.6V6.7A2.1 2.1 0 0 1 10 4.5 2.1 2.1 0 0 1 12.1 6.7V12c.8-1.7 2.9-1.8 3.9-.6 1.5-.7 3 .1 3.3 1.5 1.7-.3 3.2 1 3.2 2.7V17c0 2.7-2.5 4-5.4 4z"/></svg>Tap or click a platform to explore</div>
  </section>
</main>
<svg class="mobile-connector" id="mobileConnector" aria-hidden="true"><path id="mobileLine"/><circle id="mobileStart" r="5"/><circle id="mobileEnd" r="5"/></svg>
<script>
(()=>{
  'use strict';
  const info={
    1:{title:'Your Idea',color:'#19afe7',bullets:[
      'Open to undergraduate and graduate students.',
      'Start with coursework, research, capstones, or original ideas.',
      'Identify a real-world problem and shape a potential solution.',
      'Connect with relevant PSUT Nexus support and opportunities.']},
    2:{title:'Entrepreneur in Residence (EIR)',color:'#f3af24',bullets:[
      'Receive personalized mentoring from experienced entrepreneurs.',
      'Get guidance on products, markets, and business development.',
      'Benefit from practical feedback and professional networking.',
      'Explore next steps and possible Venture Lab support.']},
    3:{title:'PSUT Venture Lab',color:'#fa6487',bullets:[
      'Validate and refine your startup idea.',
      'Develop a business model and early prototype.',
      'Participate in hands-on mentoring and workshops.',
      'Prepare pitches and explore venture-development opportunities.']},
    4:{title:'Queen Rania Center for Entrepreneurship (QRCE)',color:'#9865e9',bullets:[
      'Participate in entrepreneurship training programs.',
      'Build skills through bootcamps and development activities.',
      'Hear from founders and experts at guest talks.',
      'Explore innovation and design-thinking workshops.']},
    5:{title:'iPARK',color:'#31c68f',bullets:[
      'Explore business incubation and acceleration support.',
      'Learn about potential investment and funding opportunities.',
      'Connect with markets, industry, and strategic partners.',
      'Access guidance for scaling and sustainable venture growth.']}
  };
  const el=document.documentElement,stages=[...document.querySelectorAll('.stage')],roadmap=document.getElementById('roadmap'),panel=document.getElementById('stageInfo'),line=document.getElementById('connectorLine'),cs=document.getElementById('connectorStart'),ce=document.getElementById('connectorEnd'),connector=document.querySelector('.connector-svg'),mobileConnector=document.getElementById('mobileConnector'),mobileLine=document.getElementById('mobileLine'),ms=document.getElementById('mobileStart'),me=document.getElementById('mobileEnd');
  let active=null,lastFocus=null;
  const themeToggle=document.getElementById('themeToggle');
  const setTheme=(dark)=>{el.dataset.theme=dark?'dark':'light';document.getElementById('themeLabel').textContent=dark?'Light mode':'Dark mode';themeToggle.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#071427':'#f5f9ff');try{localStorage.setItem('psut-nexus-theme',dark?'dark':'light')}catch(e){}};
  let stored;try{stored=localStorage.getItem('psut-nexus-theme')}catch(e){}setTheme(stored==='dark');themeToggle.addEventListener('click',()=>setTheme(el.dataset.theme!=='dark'));
  const isMobile=()=>window.matchMedia('(max-width:680px)').matches;
  function drawConnector(){
    if(!active || !panel.classList.contains('show'))return;
    const node=document.querySelector('.stage[data-id="'+active+'"]');if(!node)return;
    const nr=node.getBoundingClientRect(),pr=panel.getBoundingClientRect(),rr=roadmap.getBoundingClientRect();
    if(isMobile()){
      connector.classList.remove('show');mobileConnector.classList.add('show');
      const sx=nr.x+nr.width/2, sy=nr.y+nr.height*.6, ex=Math.min(Math.max(sx,pr.left+42),pr.right-42), ey=pr.top+4;
      mobileConnector.setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight);
      mobileLine.setAttribute('d',`M ${sx} ${sy} C ${sx} ${sy+52}, ${ex} ${ey-55}, ${ex} ${ey}`);
      ms.setAttribute('cx',sx);ms.setAttribute('cy',sy);me.setAttribute('cx',ex);me.setAttribute('cy',ey);
    }else{
      mobileConnector.classList.remove('show');connector.classList.add('show');
      connector.setAttribute('viewBox',`0 0 ${rr.width} ${rr.height}`);
      const stageX=nr.x+nr.width/2-rr.left,stageY=nr.y+nr.height*.7-rr.top;
      const center=pr.x+pr.width/2;
      const toRight=center>nr.x+nr.width/2;
      const x2=(toRight?pr.left:pr.right)-rr.left,y2=pr.top+Math.min(69,pr.height*.4)-rr.top;
      const startX=stageX+(toRight?nr.width*.18:-nr.width*.18);
      line.setAttribute('d',`M ${startX} ${stageY} C ${startX+(toRight?35:-35)} ${stageY}, ${x2+(toRight?-45:45)} ${y2}, ${x2} ${y2}`);
      cs.setAttribute('cx',startX);cs.setAttribute('cy',stageY);ce.setAttribute('cx',x2);ce.setAttribute('cy',y2);
    }
  }
  function select(n){
    if(active===n){hide();return;}
    lastFocus=document.activeElement;
    active=n;const data=info[n];
    panel.dataset.id=n;panel.querySelector('#infoNumber').textContent=n;panel.querySelector('#infoTitle').textContent=data.title;
    document.getElementById('infoBullets').replaceChildren(...data.bullets.map(t=>{const li=document.createElement('li');li.textContent=t;return li}));
    stages.forEach(s=>{const yes=s.dataset.id===String(n);s.classList.toggle('is-active',yes);s.setAttribute('aria-expanded',yes?'true':'false');s.classList.remove('pulse');if(yes){void s.offsetWidth;s.classList.add('pulse')}});
    panel.classList.add('show');connector.style.setProperty('--connector-color',data.color);mobileConnector.style.setProperty('--connector-color',data.color);
    requestAnimationFrame(()=>requestAnimationFrame(drawConnector));
  }
  function hide(){active=null;panel.classList.remove('show');connector.classList.remove('show');mobileConnector.classList.remove('show');stages.forEach(s=>{s.classList.remove('is-active','pulse');s.setAttribute('aria-expanded','false')})}
  stages.forEach(s=>s.addEventListener('click',()=>select(Number(s.dataset.id))));
  document.getElementById('closeDetails').addEventListener('click',()=>{hide();if(lastFocus?.focus)lastFocus.focus()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){hide();lastFocus?.focus?.()}});
  document.addEventListener('pointerdown',e=>{if(active&&!e.target.closest('.stage,.panel,.theme'))hide()});
  window.addEventListener('resize',()=>requestAnimationFrame(drawConnector),{passive:true});
  window.addEventListener('scroll',()=>{if(isMobile())requestAnimationFrame(drawConnector)},{passive:true});
})();
</script>
</body>
</html>
